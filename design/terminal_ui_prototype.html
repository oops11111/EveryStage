<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EveryStage 终端机 UI 原型（高保真）</title>
<!--
  风格锁 / STYLE LOCK ─────────────────────────────────────────────
  本文件为「高保真还原」原型：严格按效果图还原布局 / 配色 / 间距 / 圆角 / 层级。
  不优化、不发挥、不新增设计图之外的元素。
  全部颜色取自对原效果图 (1584×993) 的像素取色采样，锁定为下方 CSS 变量，勿凭观感改色。
  数据与视图分离：页面由文件底部 JS 的 mock 数组 + render* 纯函数生成，接真实接口时只换数据源。
  ────────────────────────────────────────────────────────────────
-->
<style>
:root{
  /* ── 取色锁定（采样自效果图）── */
  --bg:#071C33;            /* 主画布 / 窗口底 */
  --bg-top:#0A2038;        /* 顶部极淡渐变 */
  --sidebar:#081F39;       /* 侧栏底 */
  --panel:#0C2440;         /* 卡片：音频区 / 信号源 / 设置卡 */
  --panel-2:#0A1E36;       /* 深嵌层 */
  --status:#0C2650;        /* 已连接状态卡（偏蓝） */
  --stroke:rgba(140,180,255,.12);   /* 卡片描边 */
  --stroke-2:rgba(255,255,255,.05); /* 极淡内描边 */
  --accent:#0A70FE;        /* 主蓝：按钮 / 导航选中 / 激活 tab */
  --accent-hi:#2C86FF;
  --accent-glow:rgba(18,120,255,.45);
  --green:#37DE78;         /* 在线 / 已连接 / 未播放绿点 */
  --amber:#F3B24C;         /* 保存后生效 */
  --gray:#5C7292;          /* 待机灰点 */
  --purple:#9B6CFF;        /* 音频独立区图标 */
  --text:#EAF1F8;          /* 主文字 */
  --text-2:#A6B8CE;        /* 次文字 */
  --text-3:#6E86A2;        /* 说明文字 */
  --danger:#FF5D5D;
  --black:#04101F;         /* 预览 letterbox 黑边 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",-apple-system,sans-serif;
  background:linear-gradient(180deg,var(--bg-top),var(--bg) 240px);
  color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.app{display:flex;height:100vh;min-height:640px}

/* ═══════════ 侧栏（持久） ═══════════ */
.sidebar{
  width:250px;flex-shrink:0;background:var(--sidebar);
  border-right:1px solid var(--stroke);
  display:flex;flex-direction:column;padding:20px 18px;gap:16px;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 4px}
.brand .mark{width:38px;height:38px;flex-shrink:0}
.brand .name{font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1.05}
.brand .sub{font-size:12px;color:var(--text-2);letter-spacing:3px;font-weight:400}

.status-card{
  background:var(--status);border:1px solid rgba(120,160,255,.18);
  border-radius:12px;padding:12px 14px;cursor:pointer;
}
.status-card .top{display:flex;align-items:center;gap:8px}
.status-card .top b{font-size:14px;font-weight:600;flex:1}
.status-card .chev{color:var(--text-3);font-size:14px}
.status-card .lo{font-size:12px;color:var(--green);margin-top:5px;padding-left:16px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(55,222,120,.7)}
.dot.amber{background:var(--amber)}
.dot.gray{background:var(--gray)}

.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;
  border-radius:10px;color:var(--text-2);cursor:pointer;
  font-size:15px;font-weight:500;transition:background .15s,color .15s;
}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-glow)}

.side-card{border-top:1px solid var(--stroke-2);padding-top:14px}
.side-card .lbl{font-size:12px;color:var(--text-3);margin-bottom:10px}
.libcard{display:flex;align-items:center;gap:10px}
.libcard .ic{width:34px;height:34px;border-radius:8px;background:linear-gradient(150deg,#2f6fd0,#1b3f7a);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.libcard .t{font-size:13px;font-weight:600}
.libcard .d{font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.5}

.audiozone{background:rgba(120,90,230,.08);border:1px solid rgba(140,110,255,.16);
  border-radius:12px;padding:12px 13px}
.audiozone .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.audiozone .hd .ic{width:26px;height:26px;border-radius:7px;background:rgba(155,108,255,.16);
  display:flex;align-items:center;justify-content:center;color:var(--purple)}
.audiozone .hd b{font-size:13px;font-weight:600}
.audiozone .desc{font-size:11px;color:var(--text-3);line-height:1.6;margin-bottom:10px}
.wave{display:flex;align-items:flex-end;gap:2px;height:22px;margin-bottom:8px}
.wave i{width:3px;background:var(--purple);border-radius:2px;opacity:.85}
.az-time{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-bottom:8px}
.mini-track{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);position:relative}
.mini-track::after{content:'';position:absolute;left:0;top:0;height:100%;width:52%;border-radius:2px;background:var(--purple)}
.az-foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2)}
.az-foot .chk{margin-left:2px}
.spacer{flex:1}
.tagline{font-size:12px;color:var(--text-3);line-height:1.7;padding-left:4px}

/* ═══════════ 主区 ═══════════ */
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 30px 20px;gap:13px;overflow-y:auto}
.main>*{flex-shrink:0}
.titlebar{position:absolute;top:12px;right:20px;display:flex;gap:20px;color:var(--text-3);font-size:15px}
.titlebar span{cursor:default}

.page-head h1{font-size:26px;font-weight:600;letter-spacing:.5px}
.page-head p{font-size:13px;color:var(--text-3);margin-top:5px}

.page-body{display:flex;flex-direction:column;gap:13px;min-height:0}
.page-body>*{flex-shrink:0}

/* 工具栏 */
.toolbar{display:flex;align-items:center;gap:12px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--stroke);border-radius:10px;padding:3px;gap:2px}
.seg .s{padding:7px 20px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;transition:.15s}
.seg .s:hover{color:var(--text)}
.seg .s.active{background:var(--accent);color:#fff;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;
  font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--stroke);background:var(--panel-2);
  color:var(--text);transition:.15s;white-space:nowrap}
.btn:hover{border-color:rgba(140,180,255,.28);background:rgba(255,255,255,.03)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.danger:hover{border-color:rgba(255,90,90,.4);color:var(--danger)}
.dropdown{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--stroke);cursor:pointer;font-size:13px}
.dropdown .cap{color:var(--text-3);margin-right:2px}
.dropdown svg{width:14px;height:14px;color:var(--text-3)}

/* 文件网格 */
.filegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.filecard{cursor:pointer}
.filethumb{position:relative;aspect-ratio:2/1;border-radius:10px;overflow:hidden;border:1px solid var(--stroke-2)}
.filethumb .badge{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff}
.filethumb .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
  border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center}
.filecard:hover .filethumb{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.filemeta{display:flex;align-items:center;gap:6px;margin-top:7px}
.filemeta .fn{font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.filemeta .more{color:var(--text-3);letter-spacing:1px;cursor:pointer}
/* 缩略图渐变占位 */
.g-sky{background:linear-gradient(160deg,#a9cdf0,#4d7fb8 70%,#2b5488)}
.g-city{background:linear-gradient(160deg,#f4a56a,#8a5a7e 55%,#26314e)}
.g-coast{background:linear-gradient(160deg,#ffd18a,#6fa3c8 60%,#2f5d7a)}
.g-forest{background:linear-gradient(150deg,#8fd08a,#3f7d52 70%,#1f4a34)}
.g-stage{background:linear-gradient(160deg,#3a2a6a,#1a1440 60%,#0a0a24)}
.g-earth{background:radial-gradient(circle at 60% 40%,#2b6fb0,#0a1230 75%)}
.g-slide{background:linear-gradient(160deg,#dfe9f6,#9fbde0 55%,#5b7fb0)}
.g-pdf{background:linear-gradient(160deg,#eef1f5,#cdd6e2)}
.g-wave{background:linear-gradient(160deg,#0e2f6b,#061a3e 60%,#020a1c)}
.g-glass{background:linear-gradient(150deg,#9fb4c8,#5c7186 60%,#33455a)}
.g-brand{background:linear-gradient(160deg,#e8eef6,#b7c8de)}
.g-mountain{background:linear-gradient(160deg,#c4d6e6,#6f8aa6 60%,#3c556f)}

/* 卡片区块 */
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:13px 18px}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-head h3{font-size:16px;font-weight:600}
.card-head .cap{font-size:12px;color:var(--text-3)}

/* 音频播放区 */
.audiobar{display:flex;align-items:center;gap:14px}
.audiobar .ic{width:40px;height:40px;border-radius:9px;background:linear-gradient(150deg,#2f6fd0,#1b3f7a);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audiobar .nm{font-size:14px;font-weight:500;min-width:96px}
.iconbtn{width:34px;height:34px;border-radius:8px;background:var(--panel-2);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
.iconbtn:hover{border-color:rgba(140,180,255,.3)}
.iconbtn.plain{background:transparent;border:none}
.tcode{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.1);position:relative;cursor:pointer}
.track .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--accent)}
.track .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.vol{display:flex;align-items:center;gap:8px;width:120px;flex-shrink:0}
.vol .track{flex:1}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer}
.box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--stroke);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.box.on{background:var(--accent);border-color:var(--accent)}
.box svg{width:11px;height:11px;color:#fff;display:none}
.box.on svg{display:block}

/* 活动节目单 */
.act-list{display:flex;flex-direction:column;gap:10px}
.act-row{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:12px;
  background:var(--panel-2);border:1px solid var(--stroke-2)}
.act-row.sel{background:rgba(10,112,254,.1);border:1px solid rgba(20,120,255,.4)}
.act-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;color:var(--text-2)}
.act-row.sel .act-num{background:var(--accent);border-color:transparent;color:#fff}
.act-thumb{position:relative;width:120px;height:64px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--stroke-2)}
.act-thumb .badge{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff}
.act-thumb .play{position:absolute;inset:0;margin:auto;width:30px;height:30px}
.act-title b{font-size:15px;font-weight:600}
.act-title .s{font-size:12px;color:var(--text-3);margin-top:3px}
.act-title{width:150px;flex-shrink:0}
.chips{display:flex;gap:10px;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke-2);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.chip svg{width:15px;height:15px}
.act-dur{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.act-status{display:flex;align-items:center;gap:7px;font-size:13px;width:78px;flex-shrink:0}
.act-status.green{color:var(--green)}
.act-status.gray{color:var(--text-2)}
.act-exp{color:var(--text-3);cursor:pointer}
.playbar{display:flex;align-items:center;gap:14px;padding:2px 2px}
.playbar .cap{font-size:13px;color:var(--text-3)}
.playbar .cur{font-size:13px;color:var(--text-2)}
.playbar .spacer{flex:1}

/* 设置 */
.settabs{display:flex;align-items:center;gap:8px}
.settab{padding:9px 20px;border-radius:10px;font-size:14px;color:var(--text-2);cursor:pointer;background:var(--panel-2);border:1px solid var(--stroke)}
.settab:hover{color:var(--text)}
.settab.active{background:var(--accent);border-color:transparent;color:#fff;font-weight:500}
.legend{display:flex;align-items:center;gap:18px;margin-left:auto;font-size:12.5px;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:7px}
.setcard{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:16px 20px}
.setcard h4{font-size:15px;font-weight:600;margin-bottom:14px}
.setrow{display:flex;align-items:center;gap:14px}
.setrow .grow{flex:1}
.setrow .rt{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:7px}
.big-chk{width:22px;height:22px;border-radius:6px}
.big-chk svg{width:13px;height:13px}
.opt-title{font-size:14px;font-weight:500;white-space:nowrap}
.opt-sub{font-size:12px;color:var(--text-3);margin-top:3px}
.themes{display:flex;gap:14px}
.swatch{display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:10px;
  background:var(--panel-2);border:1.5px solid var(--stroke);cursor:pointer;font-size:14px}
.swatch:hover{border-color:rgba(140,180,255,.3)}
.swatch.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch .sw{width:34px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
.sw-light{background:#f2f4f8}.sw-dark{background:#0c1220}.sw-tech{background:linear-gradient(150deg,#0a70fe,#0a2a6e)}
.field{display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-width:240px;height:40px;
  padding:0 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--stroke);cursor:pointer;font-size:13px}
.field svg{width:14px;height:14px;color:var(--text-3)}
.save-row{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:4px}
.saved{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--green)}

/* 设备页 */
.dev-list{display:flex;flex-direction:column;gap:10px}
.dev-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--stroke-2)}
.dev-row.pending{background:rgba(10,112,254,.1);border-color:rgba(20,120,255,.4)}
.dev-ic{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dev-row .nm{font-size:14px;font-weight:600}
.dev-row .st{font-size:12px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:7px}

/* ── 预览播控坞（持久） ── */
.dock-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dock-head h3{font-size:16px;font-weight:600}
.dock-head .live{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--green)}
.dock-head .hint{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3)}
.preview{background:var(--panel-2);border:1px solid var(--stroke);border-radius:12px;padding:14px 16px}
.screen{background:var(--black);border-radius:8px;height:186px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.screen .frame{height:100%;aspect-ratio:16/9;position:relative;display:flex;align-items:center;overflow:hidden;
  background:
    radial-gradient(135% 105% at 90% 90%,rgba(255,201,150,.55) 0%,rgba(255,176,122,0) 42%),
    linear-gradient(180deg,#d6e5f2 0%,#bcd3e6 48%,#a4bfd8 100%)}
.screen .frame .es{position:absolute;top:22px;left:34px;font-size:20px;font-weight:700;color:#1a3a5c;letter-spacing:.3px}
.screen .frame .cap{position:absolute;right:44px;top:50%;transform:translateY(-50%);text-align:left;color:#12324f}
.screen .frame .cap b{font-size:27px;font-weight:800;line-height:1.36;display:block;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.screen .frame .cap span{display:block;margin-top:11px;font-size:12.5px;letter-spacing:.6px;color:#345d80}
.screen .frame .mtn{position:absolute;bottom:0;left:0;right:0;height:58%;
  background:linear-gradient(180deg,#eff5fb 0%,#c4d3e2 42%,#93aabf 100%);
  clip-path:polygon(0 56%,12% 27%,24% 50%,38% 13%,50% 45%,60% 31%,68% 53%,80% 68%,100% 84%,100% 100%,0 100%)}
.screen .frame .mtn2{position:absolute;bottom:0;left:0;right:0;height:42%;
  background:linear-gradient(180deg,rgba(82,108,140,.6),rgba(48,77,108,.88));
  clip-path:polygon(0 72%,16% 47%,30% 68%,46% 41%,58% 63%,70% 71%,84% 85%,100% 93%,100% 100%,0 100%)}
.transport{display:flex;align-items:center;gap:16px;margin-top:12px}
.transport .grp{display:flex;align-items:center;gap:6px}
.transport .track{flex:1}

/* ── 信号源坞（持久） ── */
.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.src-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:var(--panel-2);border:1px solid var(--stroke-2);cursor:pointer;transition:.15s}
.src-card:hover{border-color:rgba(140,180,255,.28)}
.src-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px var(--accent-glow)}
.src-thumb{width:76px;height:48px;border-radius:7px;flex-shrink:0;overflow:hidden;border:1px solid var(--stroke-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.src-info{flex:1;min-width:0}
.src-info .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-info .s{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:7px;color:var(--text-3)}
.src-info .s.green{color:var(--green)}
.src-card .more{color:var(--text-3);letter-spacing:1px}
</style>
</head>
<body>
<div class="titlebar"><span>—</span><span>▢</span><span>✕</span></div>
<div class="app">

  <!-- ═══════════ 侧栏 ═══════════ -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" fill="none">
        <rect x="1" y="1" width="46" height="46" rx="11" fill="#0a1f3e"/>
        <rect x="10" y="15" width="6" height="18" rx="2" fill="#25c9f5"/>
        <rect x="18" y="12" width="7" height="24" rx="2" fill="#1e7bff"/>

      <div class="act-dur"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${a.dur}</div>
      <div class="act-status ${a.statusColor}"><span class="dot ${a.statusColor}"></span>${a.status}</div>
      <span class="act-exp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>`));
  });
  wrap.appendChild(card);

  wrap.appendChild(el(`<div class="playbar">
    <span class="cap">播控方式</span>
    <div class="dropdown">手动播控<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>
    <span style="width:24px"></span>
    <span class="cur">当前：1. 开场介绍</span>
    <span class="spacer"></span>
    <button class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14M20 5v14L9 12z"/></svg>上一项</button>
    <button class="btn primary"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>播放/切换</button>
    <button class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 5v14M4 5l11 7-11 7z"/></svg>下一项</button>
    <span class="cur" style="margin-left:6px">下一项：2. 产品展示</span>
  </div>`));
  return wrap;
}

/* ── 设备页（效果图未提供，按同一视觉系统延展） ── */
function viewDevices(){
  const wrap=el('<div class="card"></div>');
  wrap.appendChild(el('<div class="card-head"><h3>已配对设备</h3><span class="cap">接受来投请求，或主动向已配对终端投放</span></div>'));
  const list=el('<div class="dev-list"></div>');
  DEVICES.forEach(d=>{
    const row=el(`<div class="dev-row ${d.pending?'pending':''}">
      <div class="dev-ic">${devIcon(d.kind)}</div>
      <div style="flex:1"><div class="nm">${d.name}</div><div class="st"><span class="dot ${d.dot}"></span>${d.status}</div></div>
      <button class="btn ${d.pending?'primary':''}">${d.action}</button>
    </div>`);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

/* ── 设置页 ── */
function viewSettings(){
  const wrap=el('<div style="display:flex;flex-direction:column;gap:13px"></div>');
  const tabs=SET_TABS.map(t=>`<div class="settab ${t.id===state.settingsTab?'active':''}" data-t="${t.id}">${t.label}</div>`).join('');
  const top=el(`<div class="settabs">${tabs}
    <div class="legend">
      <span><span class="dot" style="background:var(--accent)"></span>即时生效</span>
      <span><span class="dot amber"></span>保存后生效</span>
      <span><span class="dot gray"></span>重启后生效</span>
    </div></div>`);
  top.querySelectorAll('.settab').forEach(t=>t.onclick=()=>{state.settingsTab=t.dataset.t;renderPage();});
  wrap.appendChild(top);

  // 启动与运行
  wrap.appendChild(el(`<div class="setcard">
    <h4>启动与运行</h4>
    <div class="setrow">
      <span class="box big-chk on" data-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg></span>
      <div class="grow"><div class="opt-title">终端机启动时投屏开关默认开启</div><div class="opt-sub">仅影响下次启动</div></div>
      <span class="rt"><span class="dot amber"></span>保存后生效</span>
    </div>
  </div>`));

  // 外观设置
  const themeCard=el(`<div class="setcard">
    <h4>外观设置</h4>
    <div class="setrow">
      <div class="opt-title" style="width:64px">界面主题</div>
      <div class="themes"></div>
      <span class="grow"></span>
      <span class="rt"><span class="dot" style="background:var(--accent)"></span>即时生效</span>
    </div>
  </div>`);
  const themes=themeCard.querySelector('.themes');
  THEMES.forEach(t=>{
    const s=el(`<div class="swatch ${t.id===state.theme?'sel':''}"><span class="sw ${t.sw}"></span>${t.label}</div>`);
    s.onclick=()=>{state.theme=t.id;renderPage();};
    themes.appendChild(s);
  });
  wrap.appendChild(themeCard);

  // 窗口设置
  wrap.appendChild(el(`<div class="setcard">
    <h4>窗口设置</h4>
    <div class="setrow">
      <div class="opt-title" style="width:96px">窗口启动方式</div>
      <div class="field">记住上次窗口大小<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>
      <span class="grow"></span>
      <span class="rt"><span class="dot gray"></span>重启后生效</span>
    </div>
    <div class="save-row"><button class="btn primary" style="padding:0 26px">保存设置</button><span class="saved"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>已保存</span></div>
  </div>`));

  // 勾选 toggle
  wrap.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  return wrap;
}

/* ══════════════ 渲染：信号源坞（持久） ══════════════ */
function renderSources(){
  const box=document.getElementById('sources');box.innerHTML='';
  SOURCES.forEach(s=>{
    const sel=s.id===state.source;
    const thumb=s.thumb?`<div class="src-thumb ${s.thumb}"></div>`:`<div class="src-thumb">${devIcon(s.icon)}</div>`;
    const card=el(`<div class="src-card ${sel?'sel':''}">
      ${thumb}
      <div class="src-info"><div class="t">${s.title}</div><div class="s ${s.dot==='green'?'green':''}"><span class="dot ${s.dot}"></span>${s.status}</div></div>
      <span class="more">···</span>
    </div>`);
    card.onclick=()=>{state.source=s.id;renderSources();
      document.getElementById('previewState').textContent = s.id==='local'?'本地预览中 · 未投屏':(s.title+' · '+s.status);};
    box.appendChild(card);
  });
}

/* ══════════════ 交互：播放/暂停图标切换 ══════════════ */
const ICON_PLAY_S='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>';
const ICON_PAUSE_S='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY_L='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>';
const ICON_PAUSE_L='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
document.addEventListener('click',(e)=>{
  const a=e.target.closest('#audioPlay');
  if(a){state.audioPlaying=!state.audioPlaying;a.innerHTML=state.audioPlaying?ICON_PAUSE_S:ICON_PLAY_S;}
  const p=e.target.closest('#previewPlay');
  if(p){state.previewPlaying=!state.previewPlaying;p.innerHTML=state.previewPlaying?ICON_PAUSE_L:ICON_PLAY_L;}
});

/* ══════════════ 首次渲染 ══════════════ */
renderNav();renderWave();renderPage();renderSources();
</script>
</body>
</html>
