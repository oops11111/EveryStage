name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 1
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/artifacts/test-diagnostics/selftest-%p.dmp
      ES_SELFTEST_DUMP_TOOL: ${{ github.workspace }}/artifacts/tools/dotnet-dump.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet restore $project.FullName --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet build $project.FullName --no-restore --configuration Release --nologo -warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare timeout diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-diagnostics | Out-Null
          dotnet tool install dotnet-dump --tool-path artifacts/tools --version '8.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core self-tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-diagnostics | Out-Null
          dotnet run --project src/Tests/EveryStage.CoreSelfTests/EveryStage.CoreSelfTests.csproj --no-build --configuration Release 2>&1 | Tee-Object artifacts/test-diagnostics/core.log
          exit $LASTEXITCODE

      - name: Build release packages and verify native dependencies
        shell: pwsh
        run: ./scripts/Build-ReleasePackages.ps1

      - name: Run Windows content self-tests
        timeout-minutes: 12
        shell: pwsh
        run: |
          dotnet run --project src/Tests/EveryStage.WindowsSelfTests/EveryStage.WindowsSelfTests.csproj --no-build --configuration Release 2>&1 | Tee-Object artifacts/test-diagnostics/windows.log
          exit $LASTEXITCODE

      - name: Render Caster UI screenshots
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/screenshots | Out-Null
          $exe = Get-ChildItem -Path src/Caster/EveryStage.Caster/bin/Release -Recurse -Filter EveryStage.Caster.exe | Select-Object -First 1
          if (-not $exe) { throw "EveryStage.Caster.exe not found" }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--ui-screenshots', (Resolve-Path artifacts/screenshots).Path) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Caster screenshot run failed with exit code $($process.ExitCode)" }
          $shots = Get-ChildItem artifacts/screenshots -Filter 'caster-*.png'
          if ($shots.Count -lt 14) { throw "Expected 14 Caster screenshots, got $($shots.Count)" }

      - name: Upload self-test logs and timeout dumps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-test-diagnostics-${{ github.sha }}
          path: artifacts/test-diagnostics/
          if-no-files-found: warn

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-ui-screenshots-${{ github.sha }}
          path: artifacts/screenshots/*.png
          if-no-files-found: warn

      - name: Build Windows installer
        shell: pwsh
        run: |
          # The Chocolatey feed sometimes times out (504) and choco still exits 0: retry until makensis exists.
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($try = 1; -not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path $nsis); $try++) {
            if ($try -gt 4) { throw "NSIS could not be installed from Chocolatey." }
            if ($try -gt 1) { Start-Sleep -Seconds (15 * $try) }
            choco install nsis -y --no-progress
          }
          ./scripts/Build-Installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-Setup-win-x64-${{ github.sha }}
          path: artifacts/installer/EveryStage-Setup-*.exe
          if-no-files-found: error

      - name: Upload release packages (DEV-ONLY)
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-DEV-ONLY-win-x64-${{ github.sha }}
          path: |
            artifacts/release/*.zip
            artifacts/release/manifest.json
            artifacts/release/DEPLOYMENT.md
            artifacts/release/deployment/*.ps1
          if-no-files-found: error
