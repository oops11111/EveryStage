name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet restore $project.FullName --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet build $project.FullName --no-restore --configuration Release --nologo -warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run core self-tests
        run: dotnet run --project src/Tests/EveryStage.CoreSelfTests/EveryStage.CoreSelfTests.csproj --no-build --configuration Release

      - name: Build release packages and verify native dependencies
        shell: pwsh
        run: ./scripts/Build-ReleasePackages.ps1

      - name: Run Windows content self-tests
        run: dotnet run --project src/Tests/EveryStage.WindowsSelfTests/EveryStage.WindowsSelfTests.csproj --no-build --configuration Release

      - name: Upload release packages
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-win-x64-${{ github.sha }}
          path: |
            artifacts/release/*.zip
            artifacts/release/manifest.json
            artifacts/release/DEPLOYMENT.md
            artifacts/release/deployment/*.ps1
          if-no-files-found: error
