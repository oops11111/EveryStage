name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 1
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/artifacts/test-diagnostics/selftest-%p.dmp
      ES_SELFTEST_DUMP_TOOL: ${{ github.workspace }}/artifacts/tools/dotnet-dump.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up component build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare exact pinned FluidMotion package once
        shell: pwsh
        run: ./scripts/Prepare-FluidMotion.ps1

      - name: Restore projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet restore $project.FullName --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            dotnet build $project.FullName --no-restore --configuration Release --nologo -warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify Terminal exact component assets
        shell: pwsh
        run: ./scripts/Verify-FluidMotionConsumption.ps1 -OutputDirectories @('src/Terminal/EveryStage.Terminal/bin/Release/net8.0-windows10.0.22621.0/win-x64')

      - name: Prepare timeout diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-diagnostics | Out-Null
          dotnet tool install dotnet-dump --tool-path artifacts/tools --version '8.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core self-tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-diagnostics | Out-Null
          dotnet run --project src/Tests/EveryStage.CoreSelfTests/EveryStage.CoreSelfTests.csproj --no-build --configuration Release 2>&1 | Tee-Object artifacts/test-diagnostics/core.log
          exit $LASTEXITCODE

      - name: Build release packages and verify native dependencies
        shell: pwsh
        run: |
          ./scripts/Build-ReleasePackages.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Verify-FluidMotionConsumption.ps1 -OutputDirectories @('artifacts/release/EveryStage-Terminal-win-x64')

      - name: Run Windows content self-tests
        timeout-minutes: 12
        shell: pwsh
        run: |
          dotnet run --project src/Tests/EveryStage.WindowsSelfTests/EveryStage.WindowsSelfTests.csproj --no-build --configuration Release 2>&1 | Tee-Object artifacts/test-diagnostics/windows.log
          exit $LASTEXITCODE

      - name: Verify isolated actual MusicDrawer and callback lifecycle
        timeout-minutes: 4
        shell: pwsh
        run: |
          dotnet run --project src/Tests/EveryStage.MotionSelfTests/EveryStage.MotionSelfTests.csproj --no-build --configuration Release -- --output artifacts/motion-control 2>&1 | Tee-Object artifacts/test-diagnostics/motion-control.log
          exit $LASTEXITCODE

      - name: Render Caster UI screenshots
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/screenshots | Out-Null
          $exe = Get-ChildItem -Path src/Caster/EveryStage.Caster/bin/Release -Recurse -Filter EveryStage.Caster.exe | Select-Object -First 1
          if (-not $exe) { throw "EveryStage.Caster.exe not found" }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--ui-screenshots', (Resolve-Path artifacts/screenshots).Path) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Caster screenshot run failed with exit code $($process.ExitCode)" }
          $shots = Get-ChildItem artifacts/screenshots -Filter 'caster-*.png'
          if ($shots.Count -lt 14) { throw "Expected 14 Caster screenshots, got $($shots.Count)" }

      - name: Upload self-test logs and timeout dumps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-test-diagnostics-${{ github.sha }}
          path: artifacts/test-diagnostics/
          if-no-files-found: warn

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-ui-screenshots-${{ github.sha }}
          path: artifacts/screenshots/*.png
          if-no-files-found: warn

      - name: Build Windows installer
        shell: pwsh
        run: |
          # The Chocolatey feed sometimes times out (504) and choco still exits 0: retry until makensis exists.
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($try = 1; -not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path $nsis); $try++) {
            if ($try -gt 4) { throw "NSIS could not be installed from Chocolatey." }
            if ($try -gt 1) { Start-Sleep -Seconds (15 * $try) }
            choco install nsis -y --no-progress
          }
          ./scripts/Build-Installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Verify-FluidMotionConsumption.ps1 -OutputDirectories @('artifacts/installer/publish/Terminal')

      - name: Prepare immutable installer acceptance inputs and notices
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/Prepare-InstallerInput.ps1

      - name: Upload immutable installer acceptance inputs
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-installer-input-${{ github.sha }}
          path: artifacts/installer-input/**
          if-no-files-found: error

      - name: Preserve exact component package and actual-control evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-FluidMotion-control-${{ github.sha }}
          path: |
            artifacts/fluidmotion/component-state.json
            artifacts/fluidmotion/consumption-*.json
            artifacts/fluidmotion/feed/*.nupkg
            artifacts/fluidmotion/*.log
            artifacts/fluidmotion/build-*/result.json
            artifacts/motion-control/**
          if-no-files-found: warn

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-Setup-win-x64-${{ github.sha }}
          path: artifacts/installer/EveryStage-Setup-*.exe
          if-no-files-found: error

      - name: Upload release packages (DEV-ONLY)
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-DEV-ONLY-win-x64-${{ github.sha }}
          path: |
            artifacts/release/*.zip
            artifacts/release/manifest.json
            artifacts/release/DEPLOYMENT.md
            artifacts/release/deployment/*.ps1
          if-no-files-found: error

  installer-smoke:
    permissions:
      contents: read
      actions: read
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download exact inputs from this pipeline
        uses: actions/download-artifact@v7
        with:
          name: EveryStage-installer-input-${{ github.sha }}
          path: artifacts/installer-input
      - name: Download fixed user baseline without execution
        uses: actions/github-script@v8
        env:
          BASELINE_DOWNLOAD_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const response = await fetch('https://api.github.com/repos/oops11111/EveryStage/actions/artifacts/14736098352/zip', {
              headers: {Authorization: `Bearer ${process.env.BASELINE_DOWNLOAD_TOKEN}`, Accept: 'application/vnd.github+json'}
            });
            if (!response.ok) throw new Error(`Baseline download ${response.status}`);
            fs.writeFileSync('artifacts/baseline.zip', Buffer.from(await response.arrayBuffer()));
      - name: Validate UI helper compile without input or activation
        shell: powershell
        run: ./scripts/InstallerUi.ps1 -ValidateOnly
      - name: Install upgrade ordinary UI normal exit and uninstall
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -InputDirectory artifacts/installer-input -BaselineArchive artifacts/baseline.zip -OutputDirectory artifacts/installer-smoke
      - name: Record pipeline-tested immutable delivery
        shell: pwsh
        run: ./scripts/Seal-InternalDelivery.ps1 -InputDirectory artifacts/installer-input -EvidenceDirectory artifacts/installer-smoke -OutputPath artifacts/installer-smoke/pipeline-tested-manifest.json
      - name: Preserve installer evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EveryStage-installer-smoke-${{ github.sha }}
          path: artifacts/installer-smoke/**
          if-no-files-found: warn
